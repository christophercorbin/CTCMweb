name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      - name: Lint + Typecheck + Test
        run: |
          npm run lint --workspaces --if-present
          npm run typecheck --workspaces --if-present
          npm run test --workspaces --if-present

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::404875533723:role/GitHubActionsDeployRole
          aws-region: us-east-1

      # Amplify backend deploy (ampx handles CDK synth + deploy internally)
      - name: Deploy Amplify backend
        run: npx ampx pipeline-deploy --branch develop --app-id ${{ secrets.AMPLIFY_APP_ID }}

      # Frontend is auto-deployed by Amplify Hosting via Git-connected branch trigger.
      # Build here as an artifact check only.
      - name: Build frontend
        run: npm run build --workspace=apps/web
