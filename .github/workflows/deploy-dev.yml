name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      # amplify_outputs.json is gitignored — generate a stub so typecheck resolves the import
      - run: echo '{"version":"1"}' > amplify_outputs.json

      # Typecheck both the web app AND the Amplify Lambda functions.
      # The amplify workspace now has a "typecheck" script so this catches
      # Lambda TypeScript errors *before* Amplify Hosting runs pipeline-deploy.
      - name: Lint + Typecheck + Test
        run: |
          npm run lint --workspaces --if-present
          npm run typecheck --workspaces --if-present
          npm run test --workspaces --if-present

      # Backend deploy and frontend build are handled by Amplify Hosting
      # via the backend phase in amplify.yml — no need to run pipeline-deploy here.
