name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      # Typecheck both the web app AND the Amplify Lambda functions.
      # The amplify workspace now has a "typecheck" script so this catches
      # Lambda TypeScript errors *before* ampx pipeline-deploy does.
      - name: Lint + Typecheck + Test
        run: |
          npm run lint --workspaces --if-present
          npm run typecheck --workspaces --if-present
          npm run test --workspaces --if-present

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::404875533723:role/GitHubActionsDeployRole
          aws-region: us-east-1

      # Amplify backend deploy (ampx handles CDK synth + deploy internally)
      - name: Deploy Amplify backend
        run: npx ampx pipeline-deploy --branch develop --app-id ${{ secrets.AMPLIFY_APP_ID }}

      # Regenerate amplify_outputs.json and commit so Amplify Hosting always
      # bundles the correct backend config into the frontend build.
      - name: Update amplify_outputs.json
        run: |
          npx ampx generate outputs --branch develop --app-id ${{ secrets.AMPLIFY_APP_ID }} --format json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add amplify_outputs.json
          git diff --staged --quiet || git commit -m "chore: update amplify_outputs.json [skip ci]"
          git push
