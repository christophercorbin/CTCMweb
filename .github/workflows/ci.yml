name: CI

# Quality gates that run on every PR + push to main/develop.
# Deploys are handled by Amplify Hosting's webhook (see amplify.yml).
# Configure Amplify Hosting → App settings → "Require CI status" if you
# want a green CI run to be a precondition for the backend deploy.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint --workspaces --if-present

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # amplify_outputs.json is gitignored (generated per-branch by Amplify
      # Hosting). Stub it so the static import in apps/web/src/lib/amplify.ts
      # resolves at typecheck time. Covers BOTH apps/web AND amplify/ workspaces
      # (Lambda TS errors surface here instead of in the expensive pipeline-deploy).
      - run: echo '{"version":"1"}' > amplify_outputs.json
      - run: npm run typecheck --workspaces --if-present
