name: Deploy Production

on:
  # Trigger manually or on push to main
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      - name: Lint + Typecheck + Test
        run: |
          npm run lint --workspaces --if-present
          npm run typecheck --workspaces --if-present
          npm run test --workspaces --if-present

      - name: Manual approval required
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: christophercorbin
          minimum-approvals: 1
          issue-title: "Deploy to Production"
          issue-body: "Please approve or deny the production deployment"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::404875533723:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Deploy Amplify backend
        run: npx ampx pipeline-deploy --branch main --app-id ${{ secrets.AMPLIFY_APP_ID }}

      - name: Build frontend
        run: npm run build --workspace=apps/web
