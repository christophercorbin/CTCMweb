name: Deploy to Production

on:
  # Disabled until production AWS account is created
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '404875533723' # Will be updated to prod account when created

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build --workspace=@ctcm/types --workspace=@ctcm/utils

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build all workspaces
        run: npm run build

      - name: Manual approval required
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: christophercorbin
          minimum-approvals: 1
          issue-title: "Deploy to Production"
          issue-body: "Please approve or deny the production deployment"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          role-session-name: GitHubActions-Deploy-Prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Clean infra build artifacts
        run: rm -rf infra/dist infra/cdk.out

      - name: Deploy infrastructure with CDK
        run: |
          cd infra
          npm run deploy
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Deployment summary
        run: |
          echo "✅ Infrastructure deployment completed successfully!"
          echo "Note: Frontend is automatically deployed by AWS Amplify from GitHub"
          echo "View Amplify deployments: https://console.aws.amazon.com/amplify/home?region=us-east-1"

      - name: Notify deployment
        if: always()
        run: |
          echo "Production deployment ${{ job.status }}"
          # Add SNS notification or Slack webhook here
