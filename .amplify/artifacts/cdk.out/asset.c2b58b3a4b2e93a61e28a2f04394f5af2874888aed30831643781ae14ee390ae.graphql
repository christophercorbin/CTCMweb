  nextToken: String
}

input ModelInvoiceStatusInput {
  eq: InvoiceStatus
  ne: InvoiceStatus
}

input ModelInvoiceFilterInput {
  customerId: ModelIDInput
  shipmentId: ModelIDInput
  invoiceNumber: ModelStringInput
  totalAmount: ModelFloatInput
  currency: ModelStringInput
  status: ModelInvoiceStatusInput
  dueDate: ModelStringInput
  paidAt: ModelStringInput
  notes: ModelStringInput
  s3Key: ModelStringInput
  id: ModelIDInput
  createdAt: ModelStringInput
  updatedAt: ModelStringInput
  and: [ModelInvoiceFilterInput]
  or: [ModelInvoiceFilterInput]
  not: ModelInvoiceFilterInput
  owner: ModelStringInput
}

input ModelInvoiceConditionInput {
  customerId: ModelIDInput
  shipmentId: ModelIDInput
  invoiceNumber: ModelStringInput
  totalAmount: ModelFloatInput
  currency: ModelStringInput
  status: ModelInvoiceStatusInput
  dueDate: ModelStringInput
  paidAt: ModelStringInput
  notes: ModelStringInput
  s3Key: ModelStringInput
  and: [ModelInvoiceConditionInput]
  or: [ModelInvoiceConditionInput]
  not: ModelInvoiceConditionInput
  createdAt: ModelStringInput
  updatedAt: ModelStringInput
  owner: ModelStringInput
}

input CreateInvoiceInput {
  customerId: ID!
  shipmentId: ID
  invoiceNumber: String!
  totalAmount: Float!
  currency: String
  status: InvoiceStatus!
  dueDate: AWSDateTime
  paidAt: AWSDateTime
  notes: String
  s3Key: String
  id: ID
}

input UpdateInvoiceInput {
  customerId: ID
  shipmentId: ID
  invoiceNumber: String
  totalAmount: Float
  currency: String
  status: InvoiceStatus
  dueDate: AWSDateTime
  paidAt: AWSDateTime
  notes: String
  s3Key: String
  id: ID!
}

input DeleteInvoiceInput {
  id: ID!
}

input ModelSubscriptionInvoiceFilterInput {
  customerId: ModelSubscriptionIDInput
  shipmentId: ModelSubscriptionIDInput
  invoiceNumber: ModelSubscriptionStringInput
  totalAmount: ModelSubscriptionFloatInput
  currency: ModelSubscriptionStringInput
  status: ModelSubscriptionStringInput
  dueDate: ModelSubscriptionStringInput
  paidAt: ModelSubscriptionStringInput
  notes: ModelSubscriptionStringInput
  s3Key: ModelSubscriptionStringInput
  id: ModelSubscriptionIDInput
  createdAt: ModelSubscriptionStringInput
  updatedAt: ModelSubscriptionStringInput
  and: [ModelSubscriptionInvoiceFilterInput]
  or: [ModelSubscriptionInvoiceFilterInput]
  owner: ModelStringInput
}

input ModelStringKeyConditionInput {
  eq: String
  le: String
  lt: String
  ge: String
  gt: String
  between: [String]
  beginsWith: String
}
