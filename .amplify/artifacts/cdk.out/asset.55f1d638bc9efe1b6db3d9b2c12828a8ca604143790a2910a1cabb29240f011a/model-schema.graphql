enum ShipmentStatus {
  PENDING
  MIAMI_WAREHOUSE
  IN_THE_AIR
  IN_BARBADOS
  CUSTOMS_HOLD
  AT_WAREHOUSE
  ON_THE_WATER
  IN_BARBADOS_SEA
  BARBADOS_CUSTOMS
  READY_FOR_PICKUP
  OUT_FOR_DELIVERY
  DELIVERED
  DELAYED
  CANCELLED
  RETURNED
}

enum ShipmentType {
  AIR
  SEA
}

enum PackageType {
  BOX
  ENVELOPE
  PALLET
  CONTAINER
}

enum ChargeType {
  FREIGHT
  CUSTOMS_DUTY
  HANDLING
  STORAGE
  INSURANCE
  OTHER
}

enum InvoiceStatus {
  DRAFT
  SENT
  PAID
  OVERDUE
  CANCELLED
}

type Customer @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: owner, ownerField: "cognitoSub"},
  {allow: groups, groups: ["admin"]}])
{
  name: String!
  phone: String
  email: String!
  company: String
  address: String
  airSkyboxAddress: String
  seaSkyboxAddress: String
  cognitoSub: String
  shipments: [Shipment] @hasMany(references: ["customerId"])
  invoices: [Invoice] @hasMany(references: ["customerId"])
}

type Shipment @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: owner, ownerField: "customerCognitoSub"},
  {allow: groups, groups: ["admin"]}])
{
  trackingNumber: String! @index(queryField: "listShipmentByTrackingNumber")
  status: ShipmentStatus!
  type: ShipmentType!
  origin: String
  destination: String
  estimatedDelivery: AWSDateTime
  actualDelivery: AWSDateTime
  description: String
  customerId: ID! @index(queryField: "listShipmentByCustomerId")
  customerCognitoSub: String
  customer: Customer @belongsTo(references: ["customerId"])
  packages: [Package] @hasMany(references: ["shipmentId"])
  charges: [ShipmentCharge] @hasMany(references: ["shipmentId"])
  events: [ShipmentEvent] @hasMany(references: ["shipmentId"])
  invoices: [Invoice] @hasMany(references: ["shipmentId"])
}

type Package @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["admin"]}])
{
  shipmentId: ID!
  packageType: PackageType
  weight: Float
  weightUnit: String @default(value: "kg")
  length: Float
  width: Float
  height: Float
  dimensionUnit: String @default(value: "cm")
  description: String
  quantity: Int @default(value: "1")
  ocrRawText: String
  ocrConfidence: Float
  shipment: Shipment @belongsTo(references: ["shipmentId"])
}

type ShipmentCharge @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: owner, ownerField: "customerCognitoSub"},
  {allow: groups, groups: ["admin"]}])
{
  shipmentId: ID!
  chargeType: ChargeType!
  amount: Float!
  currency: String @default(value: "USD")
  description: String
  customerCognitoSub: String
  shipment: Shipment @belongsTo(references: ["shipmentId"])
}

type ShipmentEvent @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["admin"]}])
{
  shipmentId: ID! @index(sortKeyFields: ["eventTimestamp"], queryField: "listShipmentEventByShipmentIdAndEventTimestamp")
  status: ShipmentStatus!
  location: String
  description: String
  eventTimestamp: AWSDateTime!
  createdBy: String
  shipment: Shipment @belongsTo(references: ["shipmentId"])
}

type Invoice @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: owner, ownerField: "customerCognitoSub"},
  {allow: groups, groups: ["admin"]}])
{
  customerId: ID! @index(queryField: "listInvoiceByCustomerId")
  shipmentId: ID
  invoiceNumber: String! @index(queryField: "listInvoiceByInvoiceNumber")
  totalAmount: Float!
  currency: String @default(value: "USD")
  status: InvoiceStatus!
  dueDate: AWSDateTime
  paidAt: AWSDateTime
  notes: String
  s3Key: String
  customerCognitoSub: String
  trackingNumber: String
  customer: Customer @belongsTo(references: ["customerId"])
  shipment: Shipment @belongsTo(references: ["shipmentId"])
}

type SendStatusNotificationReturnType @aws_cognito_user_pools(cognito_groups: ["admin"])
{
  success: Boolean
}

type Mutation {
  sendStatusNotification(shipmentId: ID!, customerEmail: String!, customerName: String, trackingNumber: String!, status: String!, customMessage: String): SendStatusNotificationReturnType @function(name: "FnSendStatusNotification") @auth(rules: [{allow: groups, groups: ["admin"]}])
}